# onsight build environment, Linux x86-64. On ARM64 (for example NVIDIA Jetson) use sysroot_linux-aarch64=2.17.
#
#   conda env create -f environment.yml
#   conda activate onsight
#   make
#
# sysroot_linux-64=2.17: sets the oldest glibc the binary needs (conda's default, 2.34, gives binaries that do not run
#   on RHEL 8), so one build runs on RHEL 7 through current Ubuntu.
# hdf5=1.14.3: the VBZ plugin's builds for HDF5 1.14 need exactly 1.14.3, on linux-64 and linux-aarch64. It gives the
#   same outputs as 1.12; src/third_party/hdf5_tools.hpp is not ready for HDF5 2.x, so do not bump without testing.
# ont_vbz_hdf_plugin: FAST5 files written by MinKNOW since about 2020 store the signal VBZ-compressed, which HDF5
#   reads only with this plugin (HDF5_PLUGIN_PATH is set when the environment is activated). POD5 and SLOW5/BLOW5
#   do not need it.
# Not from conda: slow5lib is built from extern/slow5lib, and make downloads POD5's C library.
name: onsight

channels:
  - conda-forge
  - bioconda

dependencies:
  # Toolchain. c-compiler/cxx-compiler are metapackages that resolve per-platform.
  - c-compiler
  - cxx-compiler
  - sysroot_linux-64=2.17

  # Build tools
  - make

  # Signal-format and compression libraries
  - hdf5=1.14.3        # FAST5
  - bioconda::ont_vbz_hdf_plugin   # VBZ-compressed FAST5
  - zstd>=1.5          # needed by POD5 (8 undefined ZSTD_* symbols) and SLOW5
  - zlib

